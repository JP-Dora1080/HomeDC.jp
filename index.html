<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="alternate" href="https://www.homedc.jp/ja/" hreflang="ja">
  <link rel="alternate" href="https://www.homedc.jp/en/" hreflang="en">
</head>
<script>
  function browserLanguage() {
    try {
      return (navigator.browserLanguage || navigator.language || navigator.userLanguage).substr(0,2)
    }
    catch(e) {
      return undefined;
    }
  }

  if (browserLanguage().indexOf("ja") != -1) {
    location.replace("/ja/");
  } else {
    location.replace("/en/");
  }
</script>
</html>
